name: Integrate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - os: ubuntu-22.04
            platform: android
            arch: x64
          - os: ubuntu-22.04
            platform: android
            arch: ia32
          - os: ubuntu-22.04
            platform: android
            arch: arm64
          - os: ubuntu-22.04
            platform: android
            arch: arm
          - os: ubuntu-22.04
            platform: freertos
            arch: riscv32
            flags: -D FREERTOS_QEMU=ON
          - os: ubuntu-22.04
            platform: freertos
            arch: armv8m
            flags: -D FREERTOS_QEMU=ON
          - os: macos-15
            platform: darwin
            arch: x64
            flags: --sanitize address
          - os: macos-15
            platform: darwin
            arch: arm64
            flags: --sanitize address
          - os: macos-15
            platform: ios
            arch: arm64
          - os: macos-15
            platform: ios
            arch: arm64
            tags: -simulator
            flags: --simulator
          - os: macos-15
            platform: ios
            arch: x64
            tags: -simulator
            flags: --simulator
          - os: windows-2022
            platform: win32
            arch: x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.tags }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - uses: holepunchto/actions/setup-qemu@v1
        if: ${{ matrix.platform == 'freertos' }}
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          flags: --debug ${{ matrix.flags }}
          picolibc: ${{ matrix.platform == 'freertos' }}
      - run: bare-make test
        if: ${{ matrix.platform != 'android' && matrix.platform != 'ios' }}
